name: Public candidate radar

'on':
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'oss-hygiene/**'

permissions:
  contents: read
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect public candidates and market observations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python hunter_cloud.py

      - name: Upload scan snapshot
        uses: actions/upload-artifact@v4
        with:
          name: candidate-radar-${{ github.run_id }}
          path: |
            live_bounties.json
            LATEST_ESCROW_RADAR.md
          if-no-files-found: error
          retention-days: 14
